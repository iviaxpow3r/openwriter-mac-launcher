name: Build Mac installers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build DMG
        run: ./scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openwriter-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
